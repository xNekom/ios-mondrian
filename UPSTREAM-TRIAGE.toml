# Watermark and verdict per tracked branch.
#
# A watermark is the last commit reviewed for this port. A verdict says what
# was decided about the commits up to that point: "taken", "read-only" or
# "rejected". Every new branch needs an entry here before any of its code is
# imported. Re-review from the watermark when the branch moves; do not assume
# the old verdict still covers new commits.
#
# Check the real value with `git rev-parse <ref>` before relying on a
# watermark; a fetch can move a ref without a commit in this file changing.

base = "mondrian"
last_review = "2026-11-28"
policy = "one verdict per commit; no silent merge; no rebase of a pushed branch"

[[branch]]
